services:
  attendance-api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: ufas-attendance-api
    restart: unless-stopped
    environment:
      - ADMIN_UPSTREAM_URL=http://admin-server:9090
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ufas-data:/data
    networks:
      - ufas-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  admin-server:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: ufas-admin-server
    restart: unless-stopped
    environment:
      - MAIN_SERVER_URL=http://attendance-api:8080
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ufas-data:/data
    networks:
      - ufas-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  ufas-net:
    driver: bridge

volumes:
  ufas-data:
    driver: local
